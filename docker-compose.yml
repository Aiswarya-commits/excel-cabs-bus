services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: excel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-excel}
      POSTGRES_DB: excel_bus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U excel"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://excel:${POSTGRES_PASSWORD:-excel}@db:5432/excel_bus
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_TIMEZONE: Asia/Kolkata
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports: ["3000:3000"]
volumes:
  pgdata:
