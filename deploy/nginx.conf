# /etc/nginx/sites-available/excel-bus  — then: certbot --nginx -d bus.excelcabs.com
server {
  listen 80;
  server_name bus.excelcabs.com;
  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite (don't append) so rate limits can't be spoofed
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
